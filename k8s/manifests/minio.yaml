---
# MinIO PVC — persistent storage for object data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: irc-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# MinIO deployment — S3-compatible object storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: irc-app
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for single-replica with PVC
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Build and import this image locally:
          #   docker build -t minio:latest ./minio
          #   sudo k3s ctr images import <(docker save minio:latest)
          image: minio:latest
          imagePullPolicy: Never # Use locally imported image
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: irc-app-secret
                  key: MINIO_ROOT_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: irc-app
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
