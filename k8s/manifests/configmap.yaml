---
# Shared ConfigMap for all IRC app services
# Contains non-sensitive configuration shared across monolith, ai-service-adk, and data-processor
apiVersion: v1
kind: ConfigMap
metadata:
  name: irc-app-config
  namespace: irc-app
data:
  # JWT/Auth
  ALGORITHM: "HS256"

  # Redis
  REDIS_URL: "redis://redis:6379/0"
  REDIS_LOG_URL: "redis://redis-log:6379/0"
  AI_SESSION_STREAM_KEY: "ai:session_events"
  AI_SESSION_STREAM_MAXLEN: "500"

  # Database
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "app_db"
  DB_USER: "app_user"

  # CORS
  ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:4269,http://127.0.0.1:4269"

  # Upload limits
  MAX_UPLOAD_MB: "20"

  # User allowlists
  ADMIN_ALLOWLIST: "admina;guest;guest2"
  AI_ALLOWLIST: "admina;guest;guest2;guest3"

  # Service URLs
  DATA_PROCESSOR_URL: "http://data-processor:8003"
  MEDIA_STORAGE_URL: "http://media-storage:9101"
  BACKEND_URL: "http://monolith:8002"

  # Anthropic/Claude AI
  ANTHROPIC_API_BASE: "https://api.anthropic.com"
  AI_RATE_LIMIT_PER_HOUR: "10"

  # Feature flags
  FEATURE_DATA_PROCESSOR: "true"

  # MinIO object storage
  MINIO_ENDPOINT: "http://minio:9000"
  # REQUIRED: Replace with your VPS external IP/hostname before deploying.
  # The ingress exposes MinIO at /minio and media-storage at /media.
  # Example: http://203.0.113.10:8080/minio
  MINIO_PUBLIC_ENDPOINT: "http://CHANGE_ME:8080/minio"
  MINIO_BUCKET: "media"
  MINIO_CLAIMS_BUCKET: "synt-data"
  MINIO_CLAIMS_PREFIX: ""
  MINIO_ACCESS_KEY: "minioadmin"
  # REQUIRED: Base URL that external clients use to reach media-storage through the ingress.
  # Example: http://203.0.113.10:8080
  PUBLIC_BASE_URL: "http://CHANGE_ME:8080"
