---
# Shared Secret for all IRC app services
# Contains sensitive configuration (JWT signing key, API keys, passwords)
# In production, use external secret management (e.g., Sealed Secrets, Vault)
#
# Note: ANTHROPIC_API_KEY should be injected via run_locally_k3s.sh from environment
apiVersion: v1
kind: Secret
metadata:
  name: irc-app-secret
  namespace: irc-app
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-here"
  ANTHROPIC_API_KEY: ""
  DB_PASSWORD: "change-me-local-password"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  DP_SERVICE_AUTH_SECRET: "change-me-service-auth-secret"
